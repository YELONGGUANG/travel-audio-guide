<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f1e8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="法西导览">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <title>法西导览 · 旅行语音库</title>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div><p class="eyebrow">FRANCE · SPAIN</p><h1>法西导览</h1><p class="subtitle">你的中文景点语音库</p></div>
      <button class="icon-button" id="installButton" type="button" aria-label="添加到主屏幕" hidden>⌂</button>
    </header>
    <section class="hero-strip" aria-label="导览统计"><div><strong id="totalCount">0</strong><span>个导览</span></div><div><strong id="favoriteCount">0</strong><span>个收藏</span></div><div><strong id="recentCount">0</strong><span>最近播放</span></div></section>
    <section class="offline-panel" aria-label="离线缓存"><div><strong>出发前准备离线导览</strong><p id="offlineStatus">联网后下载一次，旅行途中无需网络也能播放。</p></div><button id="offlineButton" type="button">下载全部</button><div class="offline-progress" id="offlineProgress" hidden><span id="offlineProgressBar"></span></div></section><p class="support-note" id="supportNote" hidden></p>
    <section class="controls" aria-label="筛选导览">
      <label class="search-box"><span aria-hidden="true">⌕</span><input id="searchInput" type="search" placeholder="搜索景点、城市" autocomplete="off"></label>
      <div class="segmented" role="tablist" aria-label="国家筛选"><button class="segment active" data-country="all" role="tab">全部</button><button class="segment" data-country="france" role="tab">法国</button><button class="segment" data-country="spain" role="tab">西班牙</button><button class="segment" data-country="favorites" role="tab">收藏</button></div>
      <div class="city-row" id="cityRow"></div>
    </section>
    <section class="guide-grid" id="guideGrid" aria-live="polite"></section><p class="empty-state" id="emptyState" hidden>没有找到匹配的导览</p>
  </main>
  <section class="player" id="player" aria-label="正在播放" hidden><div class="player-info"><span class="playing-dot"></span><div><strong id="nowPlaying">选择一个导览开始</strong><small id="nowCity"></small></div></div><audio id="audio" controls playsinline preload="metadata"></audio><div class="player-actions"><button class="skip-button" id="backButton" type="button" aria-label="后退 15 秒">↶ 15</button><button class="skip-button" id="forwardButton" type="button" aria-label="前进 30 秒">30 ↷</button><button class="close-button" id="closePlayer" type="button" aria-label="关闭播放器">×</button></div></section>
  <script src="app.js"></script>
</body>
</html>
